<head>
    <meta charset="UTF-8">
    <title>Organización de las Computadoras</title>
    <link rel="stylesheet" href="organizacion.css">
   
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
    <div class="box">
        <h2>Organización de las Computadoras</h2>
        <p class="pregunta">¿Qué pasa con la información de la RAM cuando se apaga la computadora?</p>
        <button class="boton" onclick="validarOrg('A')">A) Queda guardada</button>
        <button class="boton" onclick="validarOrg('B')">B) Se borra porque se almacena temporalmente</button>
        <br>
        <p>¿Cual es la diferencia entre hardware y software?</p>
        <button class="boton" onclick="validarHar('A')">A) El hardware es la parte física de la computadora
         y que el software son los programas y aplicaciones que se ejecutan en ella.</button>
         <button class="boton" onclick="validarHar('B')">B) El hardware es la parte de los programas de la computadora
         y que el software son los circuitos fisicos de la computadora</button>
         <br>
        <p>¿Que funcion cumple el  CPU?</p>
        <button class="boton" onclick="validarHar('A')">A) Procesa las instrucciones y datos</button>
        <button class="boton" onclick="validarHar('B')">B) Almacena información de forma permanente</button>
        <br>
        <p>¿Qué diferencia hay entre discos HDD y SSD?</p>
        <button class="boton" onclick="validarOrg('A')">A) Los HDD funcionan solo microchips sin discos giratorios</button>
        <button class="boton" onclick="validarOrg('B')">B) Los  SSD  tienen partes mecánicas y usan memoria flash, siendo mas rapidos</button>
        <br>
        <p>¿Qué caracteristicas tiene la ROM?</p>
        <button class="boton" onclick="validarOrg('A')">A) Se puede borrar y reescribir facilmente cada veaz que queremos guardar algo nuevo.</button>
        <button class="boton" onclick="validarOrg('B')">B)Es de lectura y trae la información mínima fundamental que no se puede cambiar.</button>
        <br>
        <br>

    </div>
